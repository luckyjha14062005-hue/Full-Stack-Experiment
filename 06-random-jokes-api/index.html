<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Random Joke API</title>
    <style>
        body {
            font: 18px Arial;
            max-width: 700px;
            margin: 60px auto;
            text-align: center;
            padding: 20px
        }
    </style>
</head>

<body>
    <h1>Random Joke</h1>
    <p id="joke">Press the button to get a joke.</p><button id="next">Get Joke</button>
    <script>
        async function getJoke() {const p = document.querySelector('#joke'); p.textContent = 'Loading...'; try {const response = await fetch('https://official-joke-api.appspot.com/random_joke'); if (!response.ok) throw Error(); const joke = await response.json(); p.textContent = joke.setup + ' ' + joke.punchline;} catch {p.textContent = 'Could not load a joke. Check your internet connection and try again.'} }
        document.querySelector('#next').addEventListener('click', getJoke); getJoke();</script>
</body>

</html>
